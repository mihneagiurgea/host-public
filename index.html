<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Feelings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        
        #imageContainer {
            width: 80%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #imageContainer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: all 0.5s ease;
            display: block;
        }
        
        #imageContainer img.fade {
            opacity: 0;
            transform: scale(0.8);
        }
        
        #barContainer {
            width: 80%;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            margin-top: 2rem;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        #progressBar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 25px;
            transition: width 0.1s ease;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <img id="feelingImage" src="1.png" alt="Feeling">
    </div>
    <div id="barContainer">
        <div id="progressBar" style="width: 0%"></div>
    </div>
    
    <script>
        const feelings = [
            { name: 'Emotion 1', imagePath: '1.png', color: '#F4B4B4' },
            { name: 'Emotion 2', imagePath: '2.png', color: '#E8A863' },
            { name: 'Emotion 3', imagePath: '3.png', color: '#F4B4B4' },
            { name: 'Emotion 4', imagePath: '4.png', color: '#7B9AB8' },
            { name: 'Emotion 5', imagePath: '5.png', color: '#F4B4B4' },
            { name: 'Emotion 6', imagePath: '6.png', color: '#C5DDB8' },
            { name: 'Emotion 7', imagePath: '7.png', color: '#F5C563' },
            { name: 'Emotion 8', imagePath: '8.png', color: '#E8A863' },
            { name: 'Emotion 9', imagePath: '9.png', color: '#F4B4B4' },
            { name: 'Emotion 10', imagePath: '10.png', color: '#7B9AB8' },
            { name: 'Emotion 11', imagePath: '11.png', color: '#C5DDB8' },
            { name: 'Emotion 12', imagePath: '12.png', color: '#F5C563' }
        ];
        
        let currentIndex = 0;
        let barLevel = 0;
        const maxBarLevel = 100;
        const imageElement = document.getElementById('feelingImage');
        const progressBar = document.getElementById('progressBar');
        let isProcessing = false;
        let lastKey = null;
        
        function updateBar() {
            const percentage = (barLevel / maxBarLevel) * 100;
            progressBar.style.width = percentage + '%';
        }
        
        function showFeeling(index) {
            const feeling = feelings[index];
            
            if (imageElement.src) {
                imageElement.classList.add('fade');
                setTimeout(() => {
                    imageElement.src = feeling.imagePath;
                    document.body.style.backgroundColor = feeling.color;
                    setTimeout(() => {
                        imageElement.classList.remove('fade');
                    }, 50);
                }, 500);
            } else {
                imageElement.src = feeling.imagePath;
                document.body.style.backgroundColor = feeling.color;
            }
        }
        
        // Decrease bar over time
        setInterval(() => {
            if (barLevel > 0) {
                barLevel = Math.max(0, barLevel - 2);
                updateBar();
            }
        }, 100);
        
        document.addEventListener('keydown', function(e) {
            e.preventDefault();
            
            if (isProcessing) return;
            
            // Check if same key is pressed twice in a row
            if (e.key === lastKey) return;
            
            lastKey = e.key;
            
            if (barLevel < maxBarLevel) {
                barLevel = Math.min(maxBarLevel, barLevel + 10);
                updateBar();
                
                if (barLevel >= maxBarLevel) {
                    isProcessing = true;
                    setTimeout(() => {
                        currentIndex = (currentIndex + 1) % feelings.length;
                        showFeeling(currentIndex);
                        barLevel = 0;
                        lastKey = null;
                        updateBar();
                        isProcessing = false;
                    }, 200);
                }
            }
        });
        
        // Initialize
        showFeeling(0);
        updateBar();
    </script>
</body>
</html>
